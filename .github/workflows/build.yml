name: CI

on:
  push:
    branches: [master]
    tags: ["v*"]
  pull_request:
    branches: [master]
  workflow_dispatch:

# Cancel superseded runs on the same branch/tag; keep distinct tags independent.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static:
    name: Static checks (shell / JSON / whitespace)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: sh -n on shell scripts
        run: |
          for f in \
            nordvpn-wireguard/files/etc/init.d/nordvpn \
            nordvpn-wireguard/files/etc/uci-defaults/90-nordvpn-migrate \
            nordvpn-wireguard/tests/run.sh; do
            echo "sh -n $f"; sh -n "$f"
          done
      - name: Validate all JSON
        run: |
          fail=0
          for f in $(find . -path ./node_modules -prune -o -name '*.json' -print); do
            echo "jq $f"; jq -e . "$f" >/dev/null || fail=1
          done
          exit $fail
      - name: Whitespace / conflict markers
        run: git diff --check "$(git hash-object -t tree /dev/null)"

  eslint:
    name: ESLint (LuCI JS view)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
      - run: npm install --no-save --no-audit --no-fund --legacy-peer-deps eslint@9 @eslint/js@9 globals@15
      - run: npx eslint luci-app-nordvpn

  ucode:
    name: ucode syntax + offline tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build a minimal ucode (core + fs + math)
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake gcc build-essential libjson-c-dev git
          git clone --depth 1 https://github.com/jow-/ucode.git /tmp/ucode
          cd /tmp/ucode
          cmake -B build -DCMAKE_BUILD_TYPE=Release \
            -DFS_SUPPORT=ON -DMATH_SUPPORT=ON -DSTRUCT_SUPPORT=OFF \
            -DUBUS_SUPPORT=OFF -DUCI_SUPPORT=OFF -DULOOP_SUPPORT=OFF \
            -DRTNL_SUPPORT=OFF -DNL80211_SUPPORT=OFF -DRESOLV_SUPPORT=OFF \
            -DDEBUG_SUPPORT=OFF -DLOG_SUPPORT=OFF
          cmake --build build -j"$(nproc)"
      - name: Compile-check standalone ucode programs
        run: |
          UC=/tmp/ucode/build/ucode
          LIB="$PWD/nordvpn-wireguard/files/usr/share/ucode"
          MOCKS="$PWD/nordvpn-wireguard/tests/mocks"
          B=/tmp/ucode/build
          for f in \
            nordvpn-wireguard/files/usr/share/rpcd/ucode/nordvpn.uc \
            nordvpn-wireguard/files/usr/bin/nordvpn-cache-update \
            nordvpn-wireguard/files/usr/bin/nordvpn-rotate; do
            echo "ucode -c $f"
            "$UC" -L "$MOCKS/*.uc" -L "$LIB/*.uc" -L "$B/*.so" -c "$f"
          done
      - name: Run offline fixture/unit tests (modules compiled by import)
        run: |
          UCODE=/tmp/ucode/build/ucode \
          UCODE_EXTRA_L="/tmp/ucode/build/*.so" \
            sh nordvpn-wireguard/tests/run.sh

  build-backend:
    name: Build packages (snapshot SDK, apk)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download the current x86/64 snapshot SDK
        run: |
          sudo apt-get update && sudo apt-get install -y zstd
          BASE=https://downloads.openwrt.org/snapshots/targets/x86/64
          SDK=$(curl -sSL "$BASE/sha256sums" | grep -o 'openwrt-sdk-[^ ]*x86-64[^ ]*\.tar\.zst' | head -1)
          echo "SDK=$SDK"
          curl -fSL -o sdk.tar.zst "$BASE/$SDK"
          tar -I zstd -xf sdk.tar.zst
          echo "SDK=$SDK" >> "$GITHUB_ENV"
          echo "SDKDIR=${SDK%.tar.zst}" >> "$GITHUB_ENV"

      # Downloaded source tarballs are content-addressed and snapshot-agnostic:
      # reuse them across snapshot bumps via the prefix restore-key.
      - name: Cache downloaded sources (dl)
        uses: actions/cache@v4
        with:
          path: ${{ env.SDKDIR }}/dl
          key: openwrt-dl-${{ env.SDK }}
          restore-keys: |
            openwrt-dl-

      # Toolchain/host state is tied to the exact snapshot — exact key only, so a
      # snapshot bump starts clean instead of mixing incompatible toolchains.
      - name: Cache build state (feeds, staging_dir, build_dir)
        uses: actions/cache@v4
        with:
          path: |
            ${{ env.SDKDIR }}/feeds
            ${{ env.SDKDIR }}/staging_dir
            ${{ env.SDKDIR }}/build_dir
            ${{ env.SDKDIR }}/tmp
          key: openwrt-build-${{ env.SDK }}

      - name: Build both packages
        run: |
          cd "$SDKDIR"
          # Only the feeds we actually build against (luci for the app; the
          # backend lives in package/ and needs no feed). Avoids updating and
          # installing every feed.
          ./scripts/feeds update packages luci
          rm -rf package/nordvpn-wireguard
          cp -r "$GITHUB_WORKSPACE/nordvpn-wireguard" package/nordvpn-wireguard
          rm -rf feeds/luci/applications/luci-app-nordvpn
          cp -r "$GITHUB_WORKSPACE/luci-app-nordvpn" feeds/luci/applications/luci-app-nordvpn
          ./scripts/feeds install luci-base luci-app-nordvpn
          make defconfig
          make package/nordvpn-wireguard/compile package/luci-app-nordvpn/compile V=s
      - uses: actions/upload-artifact@v4
        with:
          name: nordvpn-packages
          path: ${{ env.SDKDIR }}/bin/packages/*/*/*nordvpn*.apk
          if-no-files-found: warn

  release:
    name: Publish GitHub release
    runs-on: ubuntu-latest
    needs: [static, eslint, ucode, build-backend]
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: nordvpn-packages
          path: dist
      - name: Create the release with package artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          find dist -name '*.apk'
          gh release create "$GITHUB_REF_NAME" $(find dist -name '*.apk') \
            --title "$GITHUB_REF_NAME" --generate-notes --verify-tag
